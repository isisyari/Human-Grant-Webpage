<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LakeForest.AI</title>
  <style>
    @font-face {
      font-family: 'Room 205';
      src: url('font/Room205-Regular.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --red: #b61f2a;
      --orange: #f28c28;
      --charcoal: #1a1a1a;
      --mist: #f7f7f5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Room 205', Georgia, serif;
      background: var(--mist);
      color: var(--charcoal);
      height: 100vh;
      overflow: hidden;
    }

    .welcome {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Grid background */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(182, 31, 42, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(182, 31, 42, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* Floating nodes */
    .nodes {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .node {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--red);
      border-radius: 50%;
      opacity: 0.15;
    }

    .node::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, var(--red), transparent);
      transform-origin: left center;
      opacity: 0.3;
    }

    .node:nth-child(1) { top: 15%; left: 10%; }
    .node:nth-child(1)::after { transform: rotate(25deg); }
    .node:nth-child(2) { top: 25%; left: 85%; }
    .node:nth-child(2)::after { transform: rotate(160deg); }
    .node:nth-child(3) { top: 70%; left: 15%; }
    .node:nth-child(3)::after { transform: rotate(-15deg); }
    .node:nth-child(4) { top: 80%; left: 75%; }
    .node:nth-child(4)::after { transform: rotate(200deg); }
    .node:nth-child(5) { top: 45%; left: 5%; }
    .node:nth-child(5)::after { transform: rotate(5deg); }
    .node:nth-child(6) { top: 35%; left: 92%; }
    .node:nth-child(6)::after { transform: rotate(175deg); }

    /* Top accent */
    .top-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--red);
    }

    /* Content */
    .content {
      text-align: center;
      z-index: 10;
      padding: 2rem;
    }

    .logo-img {
      height: 65px;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards 0.2s;
    }

    .title {
      font-size: 3.2rem;
      font-weight: normal;
      letter-spacing: -1px;
      margin-bottom: 0.6rem;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards 0.35s;
    }

    .title span { color: var(--red); }
    .title em { color: var(--orange); font-style: normal; }

    .tagline {
      font-size: 1rem;
      color: #777;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-weight: 400;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards 0.5s;
    }

    .enter-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      background: var(--red);
      border: none;
      color: #fff;
      font-family: 'Room 205', Georgia, serif;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards 0.65s;
    }

    .enter-btn:hover {
      background: var(--charcoal);
      gap: 14px;
    }

    .enter-btn svg {
      width: 16px;
      height: 16px;
      transition: transform 0.3s ease;
    }

    .enter-btn:hover svg {
      transform: translateX(3px);
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* ═══════════════════════════════════════════════════════════
       TRANSITION OVERLAY
       ═══════════════════════════════════════════════════════════ */
    .transition-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
    }

    .transition-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* Scan line */
    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--red);
      box-shadow:
        0 0 20px var(--red),
        0 0 60px var(--red),
        0 0 100px rgba(182, 31, 42, 0.5);
      transform: translateY(-100%);
    }

    /* Grid reveal */
    .reveal-grid {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(6, 1fr);
    }

    .reveal-cell {
      background: var(--mist);
      transform: scaleY(0);
      transform-origin: top;
    }

    /* Loading text */
    .loading-text {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
      font-size: 0.75rem;
      color: var(--red);
      letter-spacing: 2px;
      opacity: 0;
    }

    /* Final fade */
    .final-fade {
      position: absolute;
      inset: 0;
      background: var(--mist);
      opacity: 0;
    }

    /* Exit state */
    .welcome.exiting .content {
      opacity: 0;
      transform: scale(0.98);
      filter: blur(4px);
      transition: all 0.4s ease;
    }

    .welcome.exiting .grid-bg,
    .welcome.exiting .nodes {
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    @media (max-width: 600px) {
      .title { font-size: 2.2rem; }
      .tagline { font-size: 0.9rem; }
      .logo-img { height: 50px; }
      .reveal-grid {
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="welcome" id="welcome">
    <div class="grid-bg"></div>
    <div class="nodes">
      <div class="node"></div>
      <div class="node"></div>
      <div class="node"></div>
      <div class="node"></div>
      <div class="node"></div>
      <div class="node"></div>
    </div>
    <div class="top-line"></div>

    <div class="content">
      <img src="logo.png" alt="Lake Forest College" class="logo-img">
      <h1 class="title"><span>Lake</span>Forest.<em>AI</em></h1>
      <p class="tagline">Exploring AI, the Humanities & Ethics</p>
      <button class="enter-btn" id="enterBtn">
        Enter
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="transition-overlay" id="overlay">
    <div class="scan-line" id="scanLine"></div>
    <div class="reveal-grid" id="revealGrid"></div>
    <div class="loading-text" id="loadingText">INITIALIZING</div>
    <div class="final-fade" id="finalFade"></div>
  </div>

  <script>
    const enterBtn = document.getElementById('enterBtn');
    const welcome = document.getElementById('welcome');
    const overlay = document.getElementById('overlay');
    const scanLine = document.getElementById('scanLine');
    const revealGrid = document.getElementById('revealGrid');
    const loadingText = document.getElementById('loadingText');
    const finalFade = document.getElementById('finalFade');

    // Create grid cells
    const cols = window.innerWidth <= 600 ? 4 : 8;
    const rows = window.innerWidth <= 600 ? 4 : 6;
    for (let i = 0; i < cols * rows; i++) {
      const cell = document.createElement('div');
      cell.className = 'reveal-cell';
      revealGrid.appendChild(cell);
    }
    const cells = revealGrid.querySelectorAll('.reveal-cell');

    enterBtn.addEventListener('click', () => {
      // Start exit
      welcome.classList.add('exiting');
      overlay.classList.add('active');

      // Show loading text
      loadingText.style.transition = 'opacity 0.3s';
      loadingText.style.opacity = '1';

      // Animate scan line down
      scanLine.style.transition = 'transform 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
      scanLine.style.transform = 'translateY(100vh)';

      // Reveal cells row by row as scan passes
      cells.forEach((cell, i) => {
        const row = Math.floor(i / cols);
        const delay = 100 + (row * 120);

        setTimeout(() => {
          cell.style.transition = 'transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
          cell.style.transform = 'scaleY(1)';
        }, delay);
      });

      // Update loading text
      setTimeout(() => {
        loadingText.textContent = 'LOADING MODULES';
      }, 400);

      setTimeout(() => {
        loadingText.textContent = 'READY';
      }, 700);

      // Final fade and redirect
      setTimeout(() => {
        loadingText.style.opacity = '0';
        finalFade.style.transition = 'opacity 0.3s ease';
        finalFade.style.opacity = '1';
      }, 900);

      setTimeout(() => {
        window.location.href = 'home.html';
      }, 1150);
    });
  </script>
</body>
</html>
